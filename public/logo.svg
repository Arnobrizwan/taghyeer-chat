<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Relay">
  <!--
    A message bubble holding signal bars: the one thing this client does that others
    don't is survive a bad connection. Vermilion is the palette's single accent, so the
    mark needs no second colour. Every shape is a path or a plain rect so that thumbnail
    renderers outside the browser draw the tile correctly too.
  -->
